name: build-prx

on:
  push:
    paths-ignore: ['**/*.md', '**/*.txt']
  pull_request:
    paths-ignore: ['**/*.md', '**/*.txt']
  workflow_dispatch:

jobs:
  prx:
    runs-on: ubuntu-22.04

    env:
      OO_PS4_TOOLCHAIN: ${{ github.workspace }}/OpenOrbis/PS4Toolchain
      GOLDHEN_SDK:      ${{ github.workspace }}/GoldHEN_Plugins_SDK
      OO_SDK_URL: https://github.com/illusion0001/OpenOrbis-PS4-Toolchain/releases/latest/download/toolchain.tar.gz

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Install clang / lld / llvm-ar
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm

      - name: Cache OpenOrbis toolchain
        id: cache-oo
        uses: actions/cache@v4
        with:
          path: OpenOrbis
          key: oo-${{ env.OO_SDK_URL }}

      - name: Download OpenOrbis toolchain
        if: steps.cache-oo.outputs.cache-hit != 'true'
        run: |
          curl -sL "$OO_SDK_URL" | tar xz -C ./
          test -x "$OO_PS4_TOOLCHAIN/bin/linux/create-fself"

      - name: Checkout GoldHEN Plugin SDK
        uses: actions/checkout@v4
        with:
          repository: GoldHEN/GoldHEN_Plugins_SDK
          path: GoldHEN_Plugins_SDK

      - name: Build GoldHEN Hook library
        run: |
          make -C GoldHEN_Plugins_SDK -j"$(nproc)"
          make -C GoldHEN_Plugins_SDK install
          test -f "$GOLDHEN_SDK/build/crtprx.o"

      - name: Build plugin
        run: make -j"$(nproc)" VERBOSE=1

      - name: List output
        run: ls -l bin/

      - name: Upload PRX
        uses: actions/upload-artifact@v4
        with:
          name: fortnite-prx-${{ github.sha }}
          path: |
            bin/*.prx
            bin/*_stub.so
          if-no-files-found: error
