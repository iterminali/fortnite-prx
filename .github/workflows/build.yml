
name: build-test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer les outils
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git clang lld llvm meson ninja-build

      - name: Vérifier GitHub
        run: |
          git --version
          git ls-remote https://github.com/llvm/llvm-project.git HEAD

      - name: Vérifier les compilateurs
        run: |
          clang --version
          ld.lld --version
          llvm-config --version || true
          meson --version
          ninja --version

      - name: Test de compilation C
        run: |
          echo 'int main(void) { return 0; }' > test.c
          clang test.c -o test
          ./test

      - name: Résultat
        run: echo "Build de test terminé avec succès !"
