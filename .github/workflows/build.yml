name: Build Fortnite PRX

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install clang & lld
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld

      - name: Get GoldHEN SDK
        run: |
          git clone --depth=1 https://github.com/GoldHEN/GoldHEN_Plugins_SDK

          cd GoldHEN_Plugins_SDK
          make || true
          cd ..

      - name: Download OpenOrbis Toolchain (latest tarball)
        run: |
          # 1. Ask GitHub for the latest release asset URL
          ASSET_URL=$(curl -s https://api.github.com/repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/latest \
            | grep "browser_download_url.*toolchain-llvm.*tar.gz" \
            | cut -d '"' -f 4)

          if [ -z "$ASSET_URL" ]; then
            echo "Could not find the tarball asset URL"; exit 1
          fi

          echo "Downloading $ASSET_URL"
          curl -L -o openorbis.tar.gz "$ASSET_URL"

          # 2. Extract the tarball directly into the toolchain directory
          mkdir -p openorbis_toolchain
          tar -xzf openorbis.tar.gz -C openorbis_toolchain --strip-components=1

          # 3. Sanity check: make sure orbis-clang actually exists now
          if [ ! -f "$GITHUB_WORKSPACE/openorbis_toolchain/bin/linux/orbis-clang" ]; then
            echo "orbis-clang not found after extraction. Contents of toolchain dir:"
            find "$GITHUB_WORKSPACE/openorbis_toolchain" -maxdepth 3 | head -50
            exit 1
          fi

          # 4. Point the environment to the extracted toolchain
          echo "OO_PS4_TOOLCHAIN=$GITHUB_WORKSPACE/openorbis_toolchain" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/openorbis_toolchain/bin/linux" >> "$GITHUB_PATH"

      - name: Setup GoldHEN SDK
        run: |
          mkdir -p "$OO_PS4_TOOLCHAIN/lib"
          mkdir -p "$OO_PS4_TOOLCHAIN/include"

          cp GoldHEN_Plugins_SDK/lib/libGoldHEN_Hook.a "$OO_PS4_TOOLCHAIN/lib/" 2>/dev/null || true
          cp GoldHEN_Plugins_SDK/include/*.h "$OO_PS4_TOOLCHAIN/include/" 2>/dev/null || true

      - name: Build Fortnite PRX
        run: |
          "$OO_PS4_TOOLCHAIN/bin/linux/orbis-clang" \
            -shared \
            -fPIC \
            -o fortnite.prx \
            fortnite.c \
            -I"$OO_PS4_TOOLCHAIN/include" \
            -L"$OO_PS4_TOOLCHAIN/lib" \
            -lGoldHEN_Hook \
            -lkernel \
            -lSceLibKernel

      - name: Upload PRX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fortnite-prx
          path: fortnite.prx
